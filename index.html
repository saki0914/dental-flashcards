<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>暗記カード iPhone / iPad 切替版</title>
  <style>
    :root{
      --bg:#f6f7fb; --card:#fff; --line:#d9e0ea; --text:#1f2937; --muted:#6b7280;
      --accent:#2563eb; --ok:#166534; --ng:#991b1b; --warn:#92400e;
    }
    *{box-sizing:border-box}
    body{
      margin:0; background:var(--bg); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Yu Gothic",sans-serif;
    }
    .wrap{max-width:920px; margin:0 auto; padding:16px}
    .panel{
      background:var(--card); border:1px solid var(--line); border-radius:18px;
      padding:16px; box-shadow:0 4px 18px rgba(0,0,0,.04); margin-bottom:14px;
    }
    h1{font-size:24px; margin:0 0 8px}
    h2{font-size:20px; margin:0 0 8px}
    .sub{color:var(--muted); font-size:14px; line-height:1.7; margin-bottom:12px}
    .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
    .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px}
    .grid4{display:grid; grid-template-columns:repeat(4,1fr); gap:10px}
    .btn, select, textarea, input{
      width:100%; border:1px solid var(--line); border-radius:12px; background:#fff;
      min-height:48px; padding:10px 12px; font-size:16px; color:var(--text);
    }
    textarea{min-height:140px; resize:vertical}
    .btn{cursor:pointer}
    .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700}
    .btn.ok{background:#ecfdf5; color:var(--ok); border-color:#bbf7d0; font-weight:700}
    .btn.ng{background:#fef2f2; color:var(--ng); border-color:#fecaca; font-weight:700}
    .btn.soft{background:#eff6ff; color:#1d4ed8; border-color:#bfdbfe; font-weight:700}
    .choice{
      border:2px solid var(--line); border-radius:18px; padding:18px; background:#fff; text-align:left;
    }
    .choice.active{border-color:var(--accent); background:#eff6ff}
    .choice .title{font-size:20px; font-weight:800; margin-bottom:6px}
    .choice .desc{font-size:14px; color:var(--muted); line-height:1.7}
    .hidden{display:none !important}
    .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:12px 0}
    .stat{border:1px solid var(--line); border-radius:12px; padding:10px; text-align:center}
    .stat .k{display:block; font-size:12px; color:var(--muted); margin-bottom:4px}
    .stat .v{font-size:18px; font-weight:800}
    .card{
      border:1px solid var(--line); border-radius:20px; padding:18px;
      background:linear-gradient(180deg,#fff 0%,#fcfdff 100%);
    }
    .mode{font-size:13px; color:var(--muted); margin-bottom:8px}
    .question{font-size:36px; font-weight:800; text-align:center; line-height:1.35; margin:8px 0 14px; word-break:break-word}
    .answer{font-size:24px; text-align:center; color:var(--accent); min-height:36px; margin-top:10px; display:none; word-break:break-word}
    .status{
      margin-top:12px; padding:12px; border-radius:12px; font-weight:700; display:none;
      border:1px solid var(--line);
    }
    .status.ok{display:block; background:#ecfdf5; color:var(--ok); border-color:#bbf7d0}
    .status.ng{display:block; background:#fef2f2; color:var(--ng); border-color:#fecaca}
    .status.warn{display:block; background:#fff7ed; color:var(--warn); border-color:#fed7aa}
    .helper{font-size:14px; line-height:1.7; background:#fafafa; border:1px dashed var(--line); border-radius:12px; padding:12px}
    .center{text-align:center}
    @media (max-width:760px){
      .grid2,.grid3,.grid4,.stats{grid-template-columns:1fr}
      .question{font-size:30px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel" id="startPanel">
      <h1>暗記カード</h1>
      <div class="sub">
        最初に使い方を選んでください。<br>
        後からでも切り替えできます。
      </div>

      <div class="grid2">
        <button class="choice" id="chooseIphone" type="button">
          <div class="title">iPhone版</div>
          <div class="desc">
            見て覚える用です。<br>
            答えを見る → 次へ、でテンポよく学習できます。
          </div>
        </button>

        <button class="choice" id="chooseIpad" type="button">
          <div class="title">iPad版</div>
          <div class="desc">
            解答欄つきです。<br>
            Apple Pencilの手書きを文字に変換して判定できます。
          </div>
        </button>
      </div>

      <div class="grid2" style="margin-top:12px">
        <button class="btn soft" id="skipToIphone" type="button">iPhone版で始める</button>
        <button class="btn soft" id="skipToIpad" type="button">iPad版で始める</button>
      </div>
    </div>

    <div class="panel hidden" id="commonPanel">
      <h2>共通設定</h2>
      <div class="sub">
        単語はここで追加・入れ替えできます。形式は <b>漢字,よみ</b> を1行ずつです。
      </div>

      <div class="grid2">
        <select id="modeSelect">
          <option value="kanji-to-yomi">漢字 → 読み仮名</option>
          <option value="yomi-to-kanji">読み仮名 → 漢字</option>
        </select>
        <select id="deviceSelect">
          <option value="iphone">iPhone版</option>
          <option value="ipad">iPad版</option>
        </select>
      </div>

      <div style="height:10px"></div>
      <textarea id="dataInput"></textarea>

      <div class="grid3" style="margin-top:10px">
        <button class="btn primary" id="loadBtn" type="button">カード読み込み</button>
        <button class="btn soft" id="shuffleBtn" type="button">シャッフル</button>
        <button class="btn" id="resetDefaultBtn" type="button">初期単語に戻す</button>
      </div>
    </div>

    <div class="panel hidden" id="studyPanel">
      <div class="stats">
        <div class="stat"><span class="k">全カード</span><span class="v" id="totalCount">0</span></div>
        <div class="stat"><span class="k">現在</span><span class="v" id="currentCount">0</span></div>
        <div class="stat"><span class="k">正解</span><span class="v" id="correctCount">0</span></div>
        <div class="stat"><span class="k">苦手</span><span class="v" id="wrongCount">0</span></div>
      </div>

      <div class="card">
        <div class="mode" id="deviceLabel"></div>
        <div class="mode" id="modeLabel"></div>
        <div class="question" id="question">カードを読み込んでください</div>

        <div id="iphoneArea">
          <div class="answer" id="answer"></div>
          <div class="grid2" style="margin-top:12px">
            <button class="btn primary" id="showBtn" type="button">答えを見る</button>
            <button class="btn" id="nextBtn" type="button">次へ</button>
          </div>
        </div>

        <div id="ipadArea" class="hidden">
          <input id="answerInput" type="text" placeholder="ここにApple Pencilで手書き、またはキーボード入力" autocomplete="off" autocapitalize="off" spellcheck="false">
          <div class="grid3" style="margin-top:12px">
            <button class="btn primary" id="judgeBtn" type="button">判定する</button>
            <button class="btn" id="showBtnIpad" type="button">正解を見る</button>
            <button class="btn" id="nextBtnIpad" type="button">次へ</button>
          </div>
          <div class="answer" id="answerIpad"></div>
          <div class="status" id="statusBox"></div>
        </div>
      </div>

      <div class="grid3" style="margin-top:12px">
        <button class="btn ok" id="knownBtn" type="button">できた</button>
        <button class="btn ng" id="unknownBtn" type="button">まだ</button>
        <button class="btn" id="retryBtn" type="button">苦手だけ復習</button>
      </div>

      <div class="helper" id="helperText" style="margin-top:12px"></div>
    </div>
  </div>

<script>
const defaultDataText = `挨拶,あいさつ
臨床,りんしょう
処置,しょち
既往歴,きおうれき
主訴,しゅそ
洗口,せんこう
手指,しゅし
印象,いんしょう
偶発事故,ぐうはつじこ
口腔,こうくう
永久歯,えいきゅうし
乳歯,にゅうし
前歯,ぜんし
臼歯,きゅうし
切歯,せっし
智歯,ちし
小窩,しょうか
裂溝,れっこう
象牙質,ぞうげしつ
歯髄,しずい
歯槽骨,しそうこつ
口唇,こうしん
歯肉,しにく
歯間乳頭,しかんにゅうとう
唇側,しんそく
舌側,ぜっそく
頬側,きょうそく
口蓋側,こうがいそく
歯頸部,しけいぶ
近心,きんしん
遠心,えんしん
正中線,せいちゅうせん
上顎,じょうがく
下顎,かがく
萌出,ほうしゅつ
叢生,そうせい
細菌,さいきん
歯垢,しこう
歯石,しせき
脱灰,だっかい
炎症,えんしょう
咀嚼,そしゃく
嚥下,えんげ
抑制,よくせい
禁忌,きんき
疼痛,とうつう
把持,はじ
除去,じょきょ
保持,ほじ
彎曲,わんきょく
頻度,ひんど
好発,こうはつ
空隙,くうげき
喪失,そうしつ
挙上,きょじょう
用途,ようと
填塞,てんそく
合着,ごうちゃく
裏層,りそう
併用,へいよう
歯列,しれつ
粘膜,ねんまく
歯周,ししゅう
歯牙,しが
患者,かんじゃ
治療,ちりょう
診察,しんさつ
問診,もんしん
正中,せいちゅう`;

let cards = [];
let wrongCards = [];
let currentIndex = 0;
let correct = 0;
let mode = "kanji-to-yomi";
let deviceMode = "iphone";

const el = {
  startPanel: document.getElementById("startPanel"),
  commonPanel: document.getElementById("commonPanel"),
  studyPanel: document.getElementById("studyPanel"),
  chooseIphone: document.getElementById("chooseIphone"),
  chooseIpad: document.getElementById("chooseIpad"),
  skipToIphone: document.getElementById("skipToIphone"),
  skipToIpad: document.getElementById("skipToIpad"),
  modeSelect: document.getElementById("modeSelect"),
  deviceSelect: document.getElementById("deviceSelect"),
  dataInput: document.getElementById("dataInput"),
  loadBtn: document.getElementById("loadBtn"),
  shuffleBtn: document.getElementById("shuffleBtn"),
  resetDefaultBtn: document.getElementById("resetDefaultBtn"),
  totalCount: document.getElementById("totalCount"),
  currentCount: document.getElementById("currentCount"),
  correctCount: document.getElementById("correctCount"),
  wrongCount: document.getElementById("wrongCount"),
  deviceLabel: document.getElementById("deviceLabel"),
  modeLabel: document.getElementById("modeLabel"),
  question: document.getElementById("question"),
  answer: document.getElementById("answer"),
  answerIpad: document.getElementById("answerIpad"),
  iphoneArea: document.getElementById("iphoneArea"),
  ipadArea: document.getElementById("ipadArea"),
  answerInput: document.getElementById("answerInput"),
  showBtn: document.getElementById("showBtn"),
  nextBtn: document.getElementById("nextBtn"),
  judgeBtn: document.getElementById("judgeBtn"),
  showBtnIpad: document.getElementById("showBtnIpad"),
  nextBtnIpad: document.getElementById("nextBtnIpad"),
  statusBox: document.getElementById("statusBox"),
  knownBtn: document.getElementById("knownBtn"),
  unknownBtn: document.getElementById("unknownBtn"),
  retryBtn: document.getElementById("retryBtn"),
  helperText: document.getElementById("helperText")
};

function parseData(raw) {
  return raw.split("\n")
    .map(line => line.trim())
    .filter(Boolean)
    .map(line => line.split(","))
    .filter(parts => parts.length >= 2)
    .map(parts => [parts[0].trim(), parts.slice(1).join(",").trim()]);
}

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getCurrentCard() {
  return cards[currentIndex] || null;
}

function getQA(card) {
  if (!card) return ["", ""];
  return mode === "kanji-to-yomi" ? [card[0], card[1]] : [card[1], card[0]];
}

function normalizeText(text) {
  return (text || "")
    .trim()
    .replace(/\s+/g, "")
    .replace(/[ァ-ヶ]/g, s => String.fromCharCode(s.charCodeAt(0) - 0x60))
    .replace(/ー/g, "");
}

function setStatus(type, message) {
  el.statusBox.className = "status " + type;
  el.statusBox.textContent = message;
}

function clearStatus() {
  el.statusBox.className = "status";
  el.statusBox.textContent = "";
}

function updateStats() {
  el.totalCount.textContent = String(cards.length);
  el.currentCount.textContent = cards.length ? String(currentIndex + 1) : "0";
  el.correctCount.textContent = String(correct);
  el.wrongCount.textContent = String(wrongCards.length);
}

function applyDeviceMode() {
  const isIphone = deviceMode === "iphone";
  el.iphoneArea.classList.toggle("hidden", !isIphone);
  el.ipadArea.classList.toggle("hidden", isIphone);
  el.chooseIphone.classList.toggle("active", isIphone);
  el.chooseIpad.classList.toggle("active", !isIphone);
  el.deviceSelect.value = deviceMode;
  el.deviceLabel.textContent = isIphone ? "iPhone版" : "iPad版";
  el.helperText.innerHTML = isIphone
    ? "iPhone版は、<b>答えを見る → 次へ</b> でテンポよく覚える用です。"
    : "iPad版は、<b>Apple Pencilで解答欄に手書き → 判定する</b> 方式です。ScribbleをONにすると使いやすいです。";
}

function render() {
  updateStats();
  applyDeviceMode();

  const card = getCurrentCard();
  if (!card) {
    el.question.textContent = "カードを読み込んでください";
    el.answer.style.display = "none";
    el.answerIpad.style.display = "none";
    clearStatus();
    return;
  }

  const [q, a] = getQA(card);
  el.modeLabel.textContent = mode === "kanji-to-yomi" ? "漢字 → 読み仮名" : "読み仮名 → 漢字";
  el.question.textContent = q;

  el.answer.textContent = "答え： " + a;
  el.answer.style.display = "none";

  el.answerIpad.textContent = "正解： " + a;
  el.answerIpad.style.display = "none";
  el.answerInput.value = "";
  clearStatus();
}

function showStudyArea() {
  el.commonPanel.classList.remove("hidden");
  el.studyPanel.classList.remove("hidden");
}

function chooseDevice(nextMode) {
  deviceMode = nextMode;
  showStudyArea();
  render();
}

function loadCardsFromInput() {
  const raw = (el.dataInput.value || "").trim();
  const parsed = parseData(raw);
  if (!parsed.length) {
    alert("入力形式が正しくありません。\n例：歯肉,しにく");
    return;
  }
  cards = parsed;
  wrongCards = [];
  currentIndex = 0;
  correct = 0;
  render();
}

function nextCard() {
  if (!cards.length) return;
  currentIndex = (currentIndex + 1) % cards.length;
  render();
}

function markWrongList(card, isWrong) {
  const key = JSON.stringify(card);
  const exists = wrongCards.some(x => JSON.stringify(x) === key);
  if (isWrong && !exists) wrongCards.push(card);
  if (!isWrong && exists) wrongCards = wrongCards.filter(x => JSON.stringify(x) !== key);
}

function markKnown() {
  const card = getCurrentCard();
  if (!card) return;
  markWrongList(card, false);
  nextCard();
}

function markUnknown() {
  const card = getCurrentCard();
  if (!card) return;
  markWrongList(card, true);
  nextCard();
}

function retryWrongOnly() {
  if (!wrongCards.length) {
    alert("まだ苦手カードはありません。");
    return;
  }
  cards = [...wrongCards];
  currentIndex = 0;
  correct = 0;
  render();
}

function judgeAnswer() {
  const card = getCurrentCard();
  if (!card) return;

  const [, expected] = getQA(card);
  const user = el.answerInput.value;
  const nExpected = normalizeText(expected);
  const nUser = normalizeText(user);

  if (!nUser) {
    setStatus("warn", "まだ解答が入っていません。");
    return;
  }

  if (nUser === nExpected) {
    correct += 1;
    setStatus("ok", "正解です！");
    markWrongList(card, false);
  } else if (nExpected.includes(nUser) || nUser.includes(nExpected)) {
    setStatus("warn", "おしいです。正解は「" + expected + "」です。");
    markWrongList(card, true);
  } else {
    setStatus("ng", "不正解です。正解は「" + expected + "」です。");
    markWrongList(card, true);
  }
  updateStats();
}

el.chooseIphone.addEventListener("click", () => chooseDevice("iphone"));
el.chooseIpad.addEventListener("click", () => chooseDevice("ipad"));
el.skipToIphone.addEventListener("click", () => chooseDevice("iphone"));
el.skipToIpad.addEventListener("click", () => chooseDevice("ipad"));

el.modeSelect.addEventListener("change", e => { mode = e.target.value; render(); });
el.deviceSelect.addEventListener("change", e => { deviceMode = e.target.value; render(); });
el.loadBtn.addEventListener("click", loadCardsFromInput);
el.shuffleBtn.addEventListener("click", () => {
  cards = shuffleArray(cards.length ? cards : parseData(defaultDataText));
  currentIndex = 0;
  render();
});
el.resetDefaultBtn.addEventListener("click", () => {
  el.dataInput.value = defaultDataText;
  cards = parseData(defaultDataText);
  wrongCards = [];
  currentIndex = 0;
  correct = 0;
  render();
});

el.showBtn.addEventListener("click", () => { el.answer.style.display = "block"; });
el.nextBtn.addEventListener("click", nextCard);

el.judgeBtn.addEventListener("click", judgeAnswer);
el.showBtnIpad.addEventListener("click", () => { el.answerIpad.style.display = "block"; });
el.nextBtnIpad.addEventListener("click", nextCard);
el.answerInput.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    e.preventDefault();
    judgeAnswer();
  }
});

el.knownBtn.addEventListener("click", markKnown);
el.unknownBtn.addEventListener("click", markUnknown);
el.retryBtn.addEventListener("click", retryWrongOnly);

el.dataInput.value = defaultDataText;
cards = parseData(defaultDataText);
render();
</script>
</body>
</html>
